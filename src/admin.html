<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Admin Dashboard - BookBridge</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Geist:wght@100..900&family=Space+Grotesk:wght@300..700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="img/icon.png">
</head>
<body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col">
  <header class="w-full h-20 px-space-lg flex items-center justify-between border-b border-surface-container-high bg-surface">
    <a href="index.html" class="flex items-center gap-space-sm sm:gap-space-md">
      <img alt="BookBridge Logo" class="h-7 sm:h-8 w-auto object-contain" src="img/icon.png">
      <div class="flex flex-col">
        <span class="font-headline-sm text-headline-sm uppercase tracking-tight text-error leading-none text-base sm:text-xl font-bold">Admin Panel</span>
        <span class="font-label-code text-label-code text-tertiary tracking-wider uppercase mt-0 sm:mt-space-xs text-[9px] sm:text-[11px]">BookBridge System</span>
      </div>
    </a>
    <div id="auth-container" class="flex items-center gap-4">
      <button onclick="logout()" class="px-4 py-2 border border-error text-error rounded-lg hover:bg-error-container font-semibold transition-colors">Đăng xuất</button>
    </div>
  </header>

  <main class="flex-1 p-space-lg max-w-7xl mx-auto w-full flex flex-col gap-8 my-8">
    
    <!-- Users Management -->
    <section class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200" data-reveal>
      <h2 class="text-xl font-bold text-gray-900 mb-4 flex items-center gap-2" data-reveal>
        <span class="material-symbols-outlined text-primary-container">group</span> Quản lý Người Dùng
      </h2>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-gray-50 border-b border-gray-200 text-sm text-gray-600">
              <th class="p-3">Username</th>
              <th class="p-3">Vai trò</th>
              <th class="p-3">Trạng thái</th>
              <th class="p-3">Thao tác</th>
            </tr>
          </thead>
          <tbody id="users-table-body" class="text-sm">
            <tr><td colspan="4" class="p-4 text-center text-gray-500">Đang tải...</td></tr>
          </tbody>
        </table>
      </div>
    </section>

    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
      <!-- Pairing Data Management -->
      <section class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 flex flex-col" data-reveal>
        <h2 class="text-xl font-bold text-gray-900 mb-4 flex items-center gap-2" data-reveal>
          <span class="material-symbols-outlined text-blue-500">category</span> Quản lý Data (Ghép đôi)
        </h2>
        <form id="add-data-form" class="flex gap-2 mb-4">
          <select id="data-type" class="border border-gray-300 rounded-lg px-3 py-2 outline-none">
            <option value="school">Trường học</option>
            <option value="grade">Khối lớp</option>
            <option value="mode">Mô thức chia sẻ</option>
          </select>
          <input type="text" id="data-value" placeholder="Nhập giá trị..." class="flex-1 border border-gray-300 rounded-lg px-3 py-2 outline-none">
          <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg font-bold hover:bg-blue-700 transition-colors">Thêm</button>
        </form>
        <ul id="data-list" class="flex-1 overflow-y-auto max-h-[300px] border border-gray-100 rounded-lg divide-y divide-gray-100">
          <li class="p-3 text-center text-gray-500 text-sm">Đang tải...</li>
        </ul>
      </section>

      <!-- Exercises Management -->
      <section class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 flex flex-col" data-reveal>
        <h2 class="text-xl font-bold text-gray-900 mb-4 flex items-center gap-2" data-reveal>
          <span class="material-symbols-outlined text-purple-500">assignment</span> Bài tập (Giáo viên tạo)
        </h2>
        <ul id="exercises-list" class="flex-1 overflow-y-auto max-h-[350px] border border-gray-100 rounded-lg divide-y divide-gray-100">
          <li class="p-3 text-center text-gray-500 text-sm">Đang tải...</li>
        </ul>
      </section>
    </div>

  </main>

  <script>
    const token = localStorage.getItem('bb_token');
    if (!token || localStorage.getItem('bb_role') !== 'admin') {
      window.location.href = 'index.html';
    }

    const headers = {
      'Authorization': `Bearer ${token}`,
      'Content-Type': 'application/json'
    };

    function logout() {
      localStorage.clear();
      window.location.href = 'login.html';
    }

    async function loadUsers() {
      const res = await fetch('https://bookbridge-api-m0qs.onrender.com/admin/users', { headers });
      const users = await res.json();
      const tbody = document.getElementById('users-table-body');
      tbody.innerHTML = '';
      if(users.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="p-4 text-center text-gray-500">Chưa có người dùng nào.</td></tr>';
        return;
      }
      users.forEach(u => {
        let roleBadge = u.role === 'teacher' ? '<span class="bg-purple-100 text-purple-700 px-2 py-0.5 rounded text-xs font-bold">Giáo viên</span>' : '<span class="bg-blue-100 text-blue-700 px-2 py-0.5 rounded text-xs font-bold">Học sinh</span>';
        let statusBadge = u.is_approved ? '<span class="text-green-600 font-bold">Đã duyệt</span>' : '<span class="text-amber-500 font-bold">Chờ duyệt</span>';
        
        let actionBtns = '';
        if (u.role === 'teacher' && !u.is_approved) {
          actionBtns += `<button onclick="approveUser('${u.username}')" class="text-green-600 hover:underline mr-3 font-semibold">Duyệt</button>`;
        }
        actionBtns += `<button onclick="deleteUser('${u.username}')" class="text-red-600 hover:underline font-semibold">Xoá</button>`;

        tbody.innerHTML += `
          <tr class="border-b border-gray-100 hover:bg-gray-50">
            <td class="p-3 font-medium">${u.username}</td>
            <td class="p-3">${roleBadge}</td>
            <td class="p-3">${statusBadge}</td>
            <td class="p-3">${actionBtns}</td>
          </tr>
        `;
      });
    }

    async function approveUser(username) {
      if(!confirm(`Duyệt tài khoản giáo viên: ${username}?`)) return;
      await fetch(`https://bookbridge-api-m0qs.onrender.com/admin/users/${username}/approve`, { method: 'PUT', headers });
      loadUsers();
    }

    async function deleteUser(username) {
      if(!confirm(`Xoá tài khoản: ${username}? Không thể hoàn tác!`)) return;
      await fetch(`https://bookbridge-api-m0qs.onrender.com/admin/users/${username}`, { method: 'DELETE', headers });
      loadUsers();
    }

    async function loadData() {
      const res = await fetch('https://bookbridge-api-m0qs.onrender.com/admin/pairing_data', { headers });
      const data = await res.json();
      const list = document.getElementById('data-list');
      list.innerHTML = '';
      if(data.length === 0) {
        list.innerHTML = '<li class="p-3 text-center text-gray-500 text-sm">Chưa có dữ liệu nào.</li>';
        return;
      }
      data.forEach(d => {
        let typeStr = d.type === 'school' ? 'Trường' : (d.type === 'grade' ? 'Khối' : 'Mô thức');
        list.innerHTML += `
          <li class="p-3 flex justify-between items-center hover:bg-gray-50">
            <div>
              <span class="text-xs font-bold text-gray-400 uppercase mr-2">[${typeStr}]</span>
              <span class="font-medium text-gray-800">${d.value}</span>
            </div>
            <button onclick="deleteData('${d._id}')" class="text-red-500 hover:text-red-700">
              <span class="material-symbols-outlined text-[20px]">delete</span>
            </button>
          </li>
        `;
      });
    }

    document.getElementById('add-data-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const type = document.getElementById('data-type').value;
      const value = document.getElementById('data-value').value;
      if(!value) return;
      await fetch('https://bookbridge-api-m0qs.onrender.com/admin/pairing_data', {
        method: 'POST',
        headers,
        body: JSON.stringify({ type, value })
      });
      document.getElementById('data-value').value = '';
      loadData();
    });

    async function deleteData(id) {
      if(!confirm("Xoá dữ liệu này?")) return;
      await fetch(`https://bookbridge-api-m0qs.onrender.com/admin/pairing_data/${id}`, { method: 'DELETE', headers });
      loadData();
    }

    async function loadExercises() {
      const res = await fetch('https://bookbridge-api-m0qs.onrender.com/admin/exercises', { headers });
      const data = await res.json();
      const list = document.getElementById('exercises-list');
      list.innerHTML = '';
      if(data.length === 0) {
        list.innerHTML = '<li class="p-3 text-center text-gray-500 text-sm">Chưa có bài tập nào trên hệ thống.</li>';
        return;
      }
      data.forEach(d => {
        list.innerHTML += `
          <li class="p-3 flex flex-col gap-2 hover:bg-gray-50">
            <div class="flex justify-between items-start">
              <div>
                <h4 class="font-bold text-gray-800">${d.title || 'Bài tập không tên'}</h4>
                <p class="text-xs text-gray-500 mt-1">Tạo bởi: <span class="font-bold text-purple-600">${d.teacher_username}</span></p>
              </div>
              <button onclick="deleteExercise('${d._id}')" class="text-red-500 hover:text-red-700">
                <span class="material-symbols-outlined text-[20px]">delete</span>
              </button>
            </div>
          </li>
        `;
      });
    }

    async function deleteExercise(id) {
      if(!confirm("Xoá bài tập này khỏi hệ thống?")) return;
      await fetch(`https://bookbridge-api-m0qs.onrender.com/admin/exercises/${id}`, { method: 'DELETE', headers });
      loadExercises();
    }

    // Initialize
    loadUsers();
    loadData();
    loadExercises();

  </script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="js/animation.js"></script>
</body>
</html>
