<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Đăng ký - BookBridge</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script src="js/tailwind-config.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Geist:wght@100..900&family=Space+Grotesk:wght@300..700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="img/icon.png">
</head>
<body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col">
  <header class="w-full h-20 px-space-lg flex items-center justify-between border-b border-surface-container-high bg-surface">
    <a href="home_page.html" class="flex items-center gap-space-sm sm:gap-space-md">
      <img alt="BookBridge Logo" class="h-7 sm:h-8 w-auto object-contain" src="img/icon.png">
      <div class="flex flex-col">
        <span class="font-headline-sm text-headline-sm uppercase tracking-tight text-on-surface leading-none text-base sm:text-xl">BookBridge</span>
        <span class="font-label-code text-label-code text-tertiary tracking-wider uppercase mt-0 sm:mt-space-xs text-[9px] sm:text-[11px]">Open Educational Matrix</span>
      </div>
    </a>
    <a href="login.html" class="text-primary-container font-headline-sm hover:text-primary-fixed transition-colors">Đã có tài khoản? Đăng nhập</a>
  </header>

  <main class="flex-1 flex items-center justify-center p-space-lg">
    <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl border border-gray-100" data-reveal>
      <div class="text-center mb-6">
        <div class="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mx-auto mb-4">
          <span class="material-symbols-outlined text-[32px] text-emerald-600">person_add</span>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 mb-2" data-reveal>Đăng ký tài khoản</h1>
        <p class="text-sm text-gray-500">Tham gia hệ thống học liệu mở BookBridge</p>
      </div>

      <form id="register-form" class="space-y-4">
        <div id="error-msg" class="hidden p-3 bg-red-50 text-red-600 text-sm rounded-lg border border-red-100 text-center"></div>
        <div id="success-msg" class="hidden p-3 bg-emerald-50 text-emerald-600 text-sm rounded-lg border border-emerald-100 text-center"></div>
        
        <div class="space-y-1">
          <label class="block text-sm font-semibold text-gray-700">Tên đăng nhập (Username)</label>
          <input type="text" id="username" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-all outline-none" placeholder="Nhập tên đăng nhập...">
        </div>

        <div class="space-y-1">
          <label class="block text-sm font-semibold text-gray-700">Mật khẩu</label>
          <input type="password" id="password" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-all outline-none" placeholder="••••••••">
        </div>

        <div class="space-y-2">
          <label class="block text-sm font-semibold text-gray-700">Vai trò của bạn</label>
          <div class="grid grid-cols-2 gap-3">
            <label class="relative flex cursor-pointer rounded-lg border border-gray-200 bg-white p-3 hover:border-primary-container has-[:checked]:border-primary-container has-[:checked]:bg-primary-container/5 transition-all">
              <input type="radio" name="role" value="student" checked class="hidden">
              <div class="flex flex-col">
                <span class="font-bold text-gray-900 flex items-center gap-1"><span class="material-symbols-outlined text-[16px] text-blue-500">school</span>Học sinh</span>
                <span class="text-xs text-gray-500 mt-1">Làm trắc nghiệm, mượn sách</span>
              </div>
            </label>
            <label class="relative flex cursor-pointer rounded-lg border border-gray-200 bg-white p-3 hover:border-primary-container has-[:checked]:border-primary-container has-[:checked]:bg-primary-container/5 transition-all">
              <input type="radio" name="role" value="teacher" class="hidden">
              <div class="flex flex-col">
                <span class="font-bold text-gray-900 flex items-center gap-1"><span class="material-symbols-outlined text-[16px] text-purple-500">history_edu</span>Giáo viên</span>
                <span class="text-xs text-gray-500 mt-1">Cần Admin phê duyệt sau ĐK</span>
              </div>
            </label>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="w-full py-3 bg-gray-900 text-white rounded-xl font-bold hover:bg-black transition-colors shadow-md flex justify-center items-center gap-2 mt-4">
          <span>Tạo tài khoản</span>
        </button>
      </form>
    </div>
  </main>

  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const role = document.querySelector('input[name="role"]:checked').value;
      const errorMsg = document.getElementById('error-msg');
      const successMsg = document.getElementById('success-msg');
      const submitBtn = document.getElementById('submit-btn');

      errorMsg.classList.add('hidden');
      successMsg.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span>';

      try {
        const res = await fetch('http://127.0.0.1:8000/register', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username, password, role})
        });
        const data = await res.json();
        
        if (res.ok) {
          successMsg.textContent = data.message;
          successMsg.classList.remove('hidden');
          document.getElementById('register-form').reset();
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 3000);
        } else {
          errorMsg.textContent = data.detail || 'Lỗi đăng ký';
          errorMsg.classList.remove('hidden');
        }
      } catch (err) {
        errorMsg.textContent = 'Lỗi kết nối đến máy chủ';
        errorMsg.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Tạo tài khoản</span>';
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="js/animation.js"></script>
</body>
</html>
