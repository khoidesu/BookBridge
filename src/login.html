<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Đăng nhập - BookBridge</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <!-- Tailwind Config -->
  <script src="js/tailwind-config.js"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Geist:wght@100..900&family=Space+Grotesk:wght@300..700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="img/icon.png">
</head>
<body class="bg-surface font-body-md text-on-surface antialiased min-h-screen flex flex-col">
  <!-- Minimal Header -->
  <header class="w-full h-20 px-space-lg flex items-center justify-between border-b border-surface-container-high bg-surface">
    <a href="index.html" class="flex items-center gap-space-sm sm:gap-space-md">
      <img alt="BookBridge Logo" class="h-7 sm:h-8 w-auto object-contain" src="img/icon.png">
      <div class="flex flex-col">
        <span class="font-headline-sm text-headline-sm uppercase tracking-tight text-on-surface leading-none text-base sm:text-xl">BookBridge</span>
        <span class="font-label-code text-label-code text-tertiary tracking-wider uppercase mt-0 sm:mt-space-xs text-[9px] sm:text-[11px]">Open Educational Matrix</span>
      </div>
    </a>
    <a href="register.html" class="text-primary-container font-headline-sm hover:text-primary-fixed transition-colors">Đăng ký tài khoản mới</a>
  </header>

  <!-- Login Form -->
  <main class="flex-1 flex items-center justify-center p-space-lg">
    <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-xl border border-gray-100" data-reveal>
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-primary-container/10 rounded-full flex items-center justify-center mx-auto mb-4">
          <span class="material-symbols-outlined text-[32px] text-primary-container">login</span>
        </div>
        <h1 class="text-2xl font-bold text-gray-900 mb-2" data-reveal>Đăng nhập</h1>
        <p class="text-sm text-gray-500">Truy cập vào hệ thống học liệu mở BookBridge</p>
      </div>

      <form id="login-form" class="space-y-5">
        <div id="error-msg" class="hidden p-3 bg-red-50 text-red-600 text-sm rounded-lg border border-red-100 text-center"></div>
        
        <div class="space-y-1.5">
          <label class="block text-sm font-semibold text-gray-700">Tên đăng nhập (Username)</label>
          <input type="text" id="username" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-all outline-none" placeholder="Nhập tên đăng nhập...">
        </div>

        <div class="space-y-1.5">
          <label class="block text-sm font-semibold text-gray-700">Mật khẩu</label>
          <input type="password" id="password" required class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-primary-container focus:border-primary-container transition-all outline-none" placeholder="••••••••">
        </div>

        <button type="submit" id="submit-btn" class="w-full py-3 bg-primary-container text-white rounded-xl font-bold hover:bg-[#e04f00] transition-colors shadow-md flex justify-center items-center gap-2 mt-4">
          <span>Đăng nhập ngay</span>
          <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
        </button>
      </form>
    </div>
  </main>

  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const errorMsg = document.getElementById('error-msg');
      const submitBtn = document.getElementById('submit-btn');

      errorMsg.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span>';

      try {
        const res = await fetch('https://bookbridge-api-m0qs.onrender.com/login', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({username, password})
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('bb_token', data.token);
          localStorage.setItem('bb_role', data.role);
          localStorage.setItem('bb_username', data.username);
          window.location.href = 'index.html';
        } else {
          errorMsg.textContent = data.detail || 'Sai thông tin đăng nhập';
          errorMsg.classList.remove('hidden');
        }
      } catch (err) {
        errorMsg.textContent = 'Lỗi kết nối đến máy chủ';
        errorMsg.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Đăng nhập ngay</span><span class="material-symbols-outlined text-[20px]">arrow_forward</span>';
      }
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="js/animation.js"></script>
</body>
</html>
